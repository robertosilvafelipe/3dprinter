services:
  web:
    build: .
    image: pecas3d-web:latest
    container_name: pecas3d-web
    restart: unless-stopped
    environment:
      BASE_PATH: /pecas3d          # prefixo publicado pelo nginx do host
      STORAGE_BACKEND: memory      # futuro: postgres
      # DATABASE_URL: postgresql+psycopg://pecas3d:***@db:5432/pecas3d
    ports:
      - "127.0.0.1:8010:8000"      # só local; o nginx do host faz o proxy
    mem_limit: 160m

